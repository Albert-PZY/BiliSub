name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # 分支保护同时要求 `CI` 与 `verify` 两个检查上下文，
  # 因此保留双 job 结构：verify 跑真实检查，required-status 只做汇总门禁。
  verify:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  required-status:
    name: verify
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Confirm CI passed
        run: echo "CI passed"
